[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boldera-prism"
version = "0.1.0"
description = "Topic-based data collection and synthesis infrastructure."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = [
  "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]
