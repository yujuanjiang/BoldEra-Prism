[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boldera-prism"
version = "0.1.0"
description = "Topic-based data collection and synthesis infrastructure."
requires-python = ">=3.11,<3.14"
dependencies = [
  "psycopg[binary]>=3.2",
  "youtube-transcript-api>=1.0.3",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]

# Streamlit Community Cloud installs dependencies with Poetry when it sees this
# pyproject.toml. The importable package lives at src/prism_collector, not a
# folder named after the project ("boldera-prism"), so Poetry fails to locate it
# during the final "install the current project" step. Point Poetry at the real
# package location. This block is ignored by setuptools/pip, so GitHub Actions
# (`pip install -e .`) is unaffected.
[tool.poetry]
packages = [{ include = "prism_collector", from = "src" }]
