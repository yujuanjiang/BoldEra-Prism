name: Collect Topic Data

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic id from config/topics.json, or 'all' for every topic
        required: true
        default: all
      sources:
        description: Comma-separated sources to collect
        required: true
        default: youtube
      limit:
        description: Target items collected per topic per run
        required: true
        default: "20"
      dry_run:
        description: Validate setup without calling external APIs
        required: true
        type: boolean
        default: false
      sink:
        description: Destination for collected data
        required: true
        type: choice
        default: supabase
        options:
          - supabase
          - jsonl
      run_ai:
        description: Analyze collected Supabase items with AI
        required: true
        type: boolean
        default: false
      compare_limit:
        description: Recent source items to compare for similar/controversial points
        required: true
        default: "8"
  schedule:
    # Daily at 12:17 UTC (cron is always UTC). Fields: min hour day-of-month month day-of-week.
    - cron: "17 12 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOPIC: ${{ github.event.inputs.topic || 'all' }}
      SOURCES: ${{ github.event.inputs.sources || 'youtube' }}
      LIMIT: ${{ github.event.inputs.limit || '20' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      SINK: ${{ github.event.inputs.sink || 'supabase' }}
      RUN_AI: ${{ github.event.inputs.run_ai || 'false' }}
      COMPARE_LIMIT: ${{ github.event.inputs.compare_limit || '8' }}
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Quality/recency filters (tune via repo Variables; defaults shown).
      YOUTUBE_MIN_AGE_DAYS: ${{ vars.YOUTUBE_MIN_AGE_DAYS || '7' }}
      YOUTUBE_MIN_COMMENTS: ${{ vars.YOUTUBE_MIN_COMMENTS || '50' }}
      YOUTUBE_MAX_SEARCH_PAGES: ${{ vars.YOUTUBE_MAX_SEARCH_PAGES || '6' }}
      YOUTUBE_TRANSCRIPT_WEBSHARE_USERNAME: ${{ secrets.YOUTUBE_TRANSCRIPT_WEBSHARE_USERNAME }}
      YOUTUBE_TRANSCRIPT_WEBSHARE_PASSWORD: ${{ secrets.YOUTUBE_TRANSCRIPT_WEBSHARE_PASSWORD }}
      YOUTUBE_TRANSCRIPT_WEBSHARE_LOCATIONS: ${{ secrets.YOUTUBE_TRANSCRIPT_WEBSHARE_LOCATIONS }}
      YOUTUBE_TRANSCRIPT_PROXY_HTTP_URL: ${{ secrets.YOUTUBE_TRANSCRIPT_PROXY_HTTP_URL }}
      YOUTUBE_TRANSCRIPT_PROXY_HTTPS_URL: ${{ secrets.YOUTUBE_TRANSCRIPT_PROXY_HTTPS_URL }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check transcript proxy configuration
        run: |
          if [ -n "$YOUTUBE_TRANSCRIPT_WEBSHARE_USERNAME" ] && [ -n "$YOUTUBE_TRANSCRIPT_WEBSHARE_PASSWORD" ]; then
            echo "Transcript proxy: Webshare credentials present (paid 'Residential' rotating plan required for this to actually work)."
          elif [ -n "$YOUTUBE_TRANSCRIPT_PROXY_HTTP_URL" ] || [ -n "$YOUTUBE_TRANSCRIPT_PROXY_HTTPS_URL" ]; then
            echo "Transcript proxy: generic HTTP/HTTPS proxy configured."
          else
            echo "::warning::No transcript proxy configured. YouTube blocks transcript requests from GitHub Actions cloud IPs, so transcripts will be skipped. Add Webshare residential proxy secrets (YOUTUBE_TRANSCRIPT_WEBSHARE_USERNAME / YOUTUBE_TRANSCRIPT_WEBSHARE_PASSWORD)."
          fi

      - name: Transcript proxy self-test
        if: ${{ env.DRY_RUN != 'true' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from prism_collector.youtube import _fetch_transcript
          # Stable, reliably-captioned video used only to verify the proxy works.
          video_id = "dQw4w9WgXcQ"
          text = _fetch_transcript(video_id)
          if text:
              print(f"::notice::Transcript proxy OK — fetched {len(text)} chars for {video_id}.")
          else:
              print(
                  "::error::Transcript proxy NOT working (see the error above). The most "
                  "likely cause is that the Webshare plan is the free/datacenter or "
                  "'Static Residential' product, not the paid rotating 'Residential' "
                  "package that YouTube does not block."
              )
              sys.exit(1)
          PY

      - name: Collect data
        run: |
          ARGS=(
            --topic "$TOPIC"
            --sources "$SOURCES"
            --limit "$LIMIT"
            --sink "$SINK"
            --output data/raw
          )
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m prism_collector.cli "${ARGS[@]}"

      - name: Analyze collected data
        if: ${{ env.DRY_RUN != 'true' && env.SINK == 'supabase' && env.RUN_AI == 'true' }}
        run: |
          python -m prism_collector.process_cli \
            --topic "$TOPIC" \
            --limit "$LIMIT" \
            --compare-limit "$COMPARE_LIMIT"

      - name: Upload collected data
        if: ${{ env.DRY_RUN != 'true' && env.SINK == 'jsonl' }}
        uses: actions/upload-artifact@v4
        with:
          name: prism-raw-${{ env.TOPIC }}-${{ github.run_id }}
          path: data/raw/*.jsonl
          if-no-files-found: error
